[project]
name = "foundry-mcp-auth-whoami-demo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:server"]
